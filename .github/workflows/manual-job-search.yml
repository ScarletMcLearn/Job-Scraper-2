name: Manual Job Search

on:
  workflow_dispatch:
    inputs:
      config:
        description: Path to the search config file.
        required: true
        default: config/search.yml
      strictness:
        description: Search strictness mode.
        required: true
        type: choice
        default: evidence
        options:
          - strict
          - evidence
          - broad
          - lenient
          - discovery
      include_excluded:
        description: Include excluded matches in exported reports.
        required: true
        type: boolean
        default: false
      run_tests:
        description: Run the test suite before scanning.
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  scan:
    name: Scan and upload results
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      THEMUSE_API_KEY: ${{ secrets.THEMUSE_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv --cache-dir .uv-cache sync

      - name: Run tests
        if: ${{ inputs.run_tests }}
        run: uv --cache-dir .uv-cache run pytest

      - name: Prepare artifact directories
        run: mkdir -p artifacts data output

      - name: Save manual LinkedIn search URLs
        shell: bash
        run: |
          set -o pipefail
          uv --cache-dir .uv-cache run job-finder linkedin-searches --config "${{ inputs.config }}" 2>&1 | tee artifacts/linkedin-searches.txt

      - name: Run job scan
        shell: bash
        run: |
          set -o pipefail
          uv --cache-dir .uv-cache run job-finder scan --config "${{ inputs.config }}" --strictness "${{ inputs.strictness }}" 2>&1 | tee artifacts/scan.log

      - name: Export CSV
        if: always()
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ inputs.include_excluded }}" = "true" ]; then
            uv --cache-dir .uv-cache run job-finder export --config "${{ inputs.config }}" --include-excluded 2>&1 | tee artifacts/export-csv.log
          else
            uv --cache-dir .uv-cache run job-finder export --config "${{ inputs.config }}" 2>&1 | tee artifacts/export-csv.log
          fi

      - name: Export Markdown
        if: always()
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ inputs.include_excluded }}" = "true" ]; then
            uv --cache-dir .uv-cache run job-finder export-markdown --config "${{ inputs.config }}" --output output/jobs.md --include-excluded 2>&1 | tee artifacts/export-markdown.log
          else
            uv --cache-dir .uv-cache run job-finder export-markdown --config "${{ inputs.config }}" --output output/jobs.md 2>&1 | tee artifacts/export-markdown.log
          fi

      - name: Prepare GitHub Pages site
        id: prepare-pages
        if: always()
        shell: bash
        run: |
          if [ -f output/jobs.md ]; then
            mkdir -p pages
            {
              printf '%s\n' '---'
              printf '%s\n' 'title: Job Search Results'
              printf '%s\n' '---'
              printf '\n'
              cat output/jobs.md
            } > pages/index.md
            if [ -f output/jobs.csv ]; then
              cp output/jobs.csv pages/jobs.csv
            fi
            printf '%s\n' 'title: Job Search Results' > pages/_config.yml
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Markdown report not found; skipping GitHub Pages deployment."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure GitHub Pages
        if: steps.prepare-pages.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - name: Build GitHub Pages site
        if: steps.prepare-pages.outputs.publish == 'true'
        uses: actions/jekyll-build-pages@v1
        with:
          source: pages
          destination: _site

      - name: Upload GitHub Pages artifact
        if: steps.prepare-pages.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages site
        id: deployment
        if: steps.prepare-pages.outputs.publish == 'true'
        uses: actions/deploy-pages@v4

      - name: Upload job search results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-search-results-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            data/
            output/
            artifacts/
