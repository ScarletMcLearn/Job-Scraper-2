filters:
  target_country: Bangladesh
  # Options: strict, evidence, broad, lenient, discovery.
  # Use lenient or discovery when you want more results to review.
  strictness: evidence
  role_keywords:
    - QA
    - Test
    - SQA
    - SDET
    - QA engineer
    - QA analyst
    - quality engineer
    - quality assurance
    - software quality engineer
    - software quality assurance
    - software development engineer in test
    - test engineer
    - test automation
    - manual tester
    - automation
    - automation engineer
    - selenium
    - cypress
    - playwright
sources:
  remotive:
    enabled: true
    search_terms:
      - qa
      - qa engineer
      - qa analyst
      - quality assurance
      - quality engineer
      - software quality engineer
      - test engineer
      - test automation
      - manual tester
      - sdet
      - automation engineer
  arbeitnow:
    enabled: true
    max_pages: 2
  himalayas:
    enabled: true
    search_terms:
      - qa
      - qa engineer
      - qa analyst
      - quality assurance
      - quality engineer
      - software quality engineer
      - test engineer
      - test automation
      - manual tester
      - sdet
      - automation engineer
    max_pages: 2
    page_size: 20
  jobicy:
    enabled: true
    search_terms:
      - qa
      - qa engineer
      - qa analyst
      - quality assurance
      - quality engineer
      - software quality engineer
      - test engineer
      - test automation
      - manual tester
      - sdet
      - automation engineer
    count: 50
  remoteok:
    enabled: true
    max_results: 100
  remotejobs_org:
    enabled: true
    search_terms:
      - qa
      - qa engineer
      - qa analyst
      - quality assurance
      - quality engineer
      - software quality engineer
      - test engineer
      - test automation
      - manual tester
      - sdet
      - automation engineer
    limit: 50
    max_pages: 2
  weworkremotely:
    enabled: true
    feed_urls:
      - https://weworkremotely.com/remote-jobs.rss
    max_items_per_feed: 100
  themuse:
    enabled: true
    api_key_env: THEMUSE_API_KEY
    categories:
      - Software Engineering
      - Science and Engineering
    locations:
      - Flexible / Remote
      - Remote
    max_pages: 2
  adzuna:
    enabled: true
    app_id_env: ADZUNA_APP_ID
    app_key_env: ADZUNA_APP_KEY
    search_terms:
      - qa
    country_codes:
      - gb
      - us
      - ca
    # Adzuna does not reliably return remote roles through where=remote.
    # Search broadly and let the evidence filters reject non-eligible roles.
    locations:
      - ""
    max_pages: 1
    results_per_page: 20
    request_delay_seconds: 1.0
  jooble:
    enabled: true
    api_key_env: JOOBLE_API_KEY
    search_terms:
      - qa
      - qa engineer
      - qa analyst
      - quality assurance
      - quality engineer
      - software quality engineer
      - test engineer
      - test automation
      - manual tester
      - sdet
      - automation engineer
    locations:
      - Remote
      - Worldwide
      - Bangladesh
    max_pages: 2
    results_per_page: 50
  workable:
    enabled: true
    account_subdomains: []
  recruitee:
    enabled: true
    feed_urls: []
  workanywhere:
    enabled: false
    feed_urls:
      - https://workanywhere.pro/rss.xml
      - https://workanywhere.pro/rss/engineer.xml
    max_items_per_feed: 100
  ashby:
    enabled: true
    # Add Ashby board names from URLs like https://jobs.ashbyhq.com/Ashby.
    organization_names:
      - Ashby
      - OpenAI
      - supabase
    include_compensation: false
  greenhouse:
    enabled: true
    board_tokens:
      - gitlab
      - canonical
  lever:
    enabled: true
    companies:
      - revealtech
      - insiderone
      - chooose
      - pingwind
      - heartbeathealth
      - getwingapp
      - caseware
  smartrecruiters:
    enabled: true
    # Add company identifiers from URLs like https://careers.smartrecruiters.com/smartrecruiters.
    companies:
      - SmartRecruiters
    search_terms:
      - qa
      - qa engineer
      - qa analyst
      - quality assurance
      - quality engineer
      - software quality engineer
      - test engineer
      - test automation
      - manual tester
      - sdet
      - automation engineer
    limit: 50
  linkedin:
    enabled: false
    manual_locations:
      - Worldwide
      - Remote
      - Bangladesh
output:
  database_path: data/jobs.sqlite
  csv_path: output/jobs.csv
